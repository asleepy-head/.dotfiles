# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  colors.webpage.bg:
    global: black
  colors.webpage.darkmode.enabled:
    global: true
  colors.webpage.darkmode.policy.page:
    global: smart
  colors.webpage.preferred_color_scheme:
    global: dark
  content.javascript.clipboard:
    https://github.com: access-paste
  content.mouse_lock:
    https://anikototv.to: true
  content.register_protocol_handler:
    https://mail.proton.me#mailto=%25s: false
    https://outlook.live.com?mailtouri=%25s: false
  fonts.default_family:
    global: null
  fonts.default_size:
    global: 10pt
  scrolling.smooth:
    global: true
  url.default_page:
    global: https://start.duckduckgo.com/
  url.searchengines:
    global:
      '!ani': https://anikototv.to/filter?keyword={}
      '!g': https://google.com/search?q={}
      '!modr': https://modrinth.com/discover/mods?q={}
      '!mynix': https://mynixos.com/search?q={}
      '!pkgs': https://search.nixos.org/packages?channel=26.05&query={}
      '!yt': https://www.youtube.com/results?search_query={}
      DEFAULT: https://duckduckgo.com/?q={}
  url.start_pages:
    global: https://start.duckduckgo.com
  zoom.default:
    global: 100%
